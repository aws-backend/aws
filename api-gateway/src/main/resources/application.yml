# Кастомная конфигурация окружения
app:
  environment: Local
  application:
    version: "@application.version@"

server:
  port: 8084

spring:
  application:
    name: api-gateway

  mvc:
    servlet:
      path: /api/v1

  output:
    ansi:
      enabled: always # Включить поддержку ANSI

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - env    # only in dev mode
          - beans  # only in dev mode

  endpoint:
    health:
      probes:
        enabled: true

